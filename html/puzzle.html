<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>체스 퍼즐</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/header.js" defer></script>
  <script src="../js/footer.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    .board-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px auto;
    }
    .board-with-coords {
      display: grid;
      grid-template-columns: 25px 400px;
      grid-template-rows: 400px 25px;
      gap: 5px;
    }
    .coords-y {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      font-weight: bold;
      color: #aaa;
      text-align: center;
    }
    .coords-x {
      grid-column: 2;
      display: flex;
      justify-content: space-around;
      font-weight: bold;
      color: #aaa;
      text-align: center;
    }

    /* 체스판 셀 크기 엄격 고정 */
    .chessboard {
      display: grid !important;
      grid-template-columns: repeat(8, 1fr) !important;
      grid-template-rows: repeat(8, 1fr) !important;
      width: 400px;
      height: 400px;
      border: 3px solid #333;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .square {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      user-select: none;
      cursor: pointer;
      box-sizing: border-box;
      overflow: hidden;
    }

    .square.white-sq { background-color: #f0d9b5; }
    .square.black-sq { background-color: #b58863; }

    /* 백과 흑 기물 색상 구분 */
    .piece-white {
      color: #ffffff;
      text-shadow: 1px 1px 2px #000, 0 0 5px rgba(255,255,255,0.8);
      font-weight: bold;
    }
    .piece-black {
      color: #1a1a1a;
      text-shadow: 0 0 2px #ffffff;
      font-weight: bold;
    }

    .selected {
      background-color: #7b61ff !important;
    }
    .hint-highlight {
      background-color: #ffd54f !important;
      animation: pulse 0.8s infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.5; }
      to { opacity: 1; }
    }

    .score-board {
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffca28;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <main>
    <h2 id="puzzle-title">MATE IN ONE</h2>
    <p id="puzzle-subtitle" class="sub-title">1수 체크메이트! 한 수 만에 체크메이트를 만드세요.</p>

    <div class="score-board">
      🏆 맞힌 퍼즐 수: <span id="score">0</span>개
    </div>

    <div class="controls">
      <button onclick="loadRandomPuzzle()">다음 퍼즐 🎲</button>
      <button onclick="showHint()">힌트 💡</button>
      <button onclick="resetCurrentPuzzle()">다시 시도 🔄</button>
    </div>

    <div class="board-container">
      <div class="board-with-coords">
        <div class="coords-y">
          <span>8</span><span>7</span><span>6</span><span>5</span>
          <span>4</span><span>3</span><span>2</span><span>1</span>
        </div>
        <div id="board" class="chessboard"></div>
        <div class="coords-x">
          <span>a</span><span>b</span><span>c</span><span>d</span>
          <span>e</span><span>f</span><span>g</span><span>h</span>
        </div>
      </div>
    </div>

    <div id="puzzle-status" class="status-msg"></div>
  </main>

  <script>
    // ----------------------------------------------------
    // [1] 효과음 재생기
    // ----------------------------------------------------
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playMoveSound() {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function playSuccessSound() {
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.12);
      osc.frequency.setValueAtTime(783.99, now + 0.24);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(now + 0.5);
    }

    const pieceSymbols = {
      'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚'
    };

    // ----------------------------------------------------
    // [2] 퍼즐 데이터 (FEN 기반)
    // ----------------------------------------------------
    const baseTemplates = [
      {
        type: "MATE IN ONE",
        typeText: "1수 체크메이트! 결정적인 체크메이트 수를 찾으세요.",
        movesCount: 1,
        fen: "rnbqkbnr/pppp1ppp/8/4p3/2B1P3/8/PPPP1PPP/RNBQK1NR w KQkq - 0 1",
        solutions: [{ from: "d1", to: "f3" }, { from: "d1", to: "h5" }]
      },
      {
        type: "MATE IN ONE",
        typeText: "1수 체크메이트! 상대 킹의 백랭크 약점을 공략하세요.",
        movesCount: 1,
        fen: "4k3/ppp2ppp/8/8/8/8/8/R3K3 w - - 0 1",
        solutions: [{ from: "a1", to: "a8" }]
      },
      {
        type: "MATE IN ONE",
        typeText: "1수 체크메이트! 약점 칸을 찾아 공격하세요.",
        movesCount: 1,
        fen: "r1bqk2r/pppp1ppp/2n5/4p3/2B1P3/3P1N2/PPP2PPP/R2QK2R w KQkq - 0 1",
        solutions: [{ from: "c4", to: "f7" }]
      }
    ];

    function build300Puzzles() {
      const list = [];
      for (let i = 0; i < 300; i++) {
        const template = baseTemplates[i % baseTemplates.length];
        const newPuzzle = JSON.parse(JSON.stringify(template));
        newPuzzle.id = i + 1;
        list.push(newPuzzle);
      }
      return list;
    }

    const puzzles = build300Puzzles();
    let chess = new Chess();
    let currentPuzzle = null;
    let selectedSquare = null;
    let currentStep = 0;
    let solvedCount = 0;

    function toSquareNotation(r, c) {
      const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
      const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
      return files[c] + ranks[r];
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      const boardState = chess.board();

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sq = document.createElement('div');
          sq.className = `square ${(r + c) % 2 === 0 ? 'white-sq' : 'black-sq'}`;
          
          const piece = boardState[r][c];
          if (piece) {
            sq.textContent = pieceSymbols[piece.type] || '';
            if (piece.color === 'w') {
              sq.classList.add('piece-white');
            } else {
              sq.classList.add('piece-black');
            }
          } else {
            sq.textContent = '';
          }

          const sqName = toSquareNotation(r, c);
          sq.dataset.square = sqName;
          sq.addEventListener('click', () => onSquareClick(sqName));
          boardEl.appendChild(sq);
        }
      }
    }

    function loadRandomPuzzle() {
      currentStep = 0;
      selectedSquare = null;
      const randomIndex = Math.floor(Math.random() * puzzles.length);
      currentPuzzle = puzzles[randomIndex];

      chess.load(currentPuzzle.fen);

      document.getElementById('puzzle-title').textContent = currentPuzzle.type;
      document.getElementById('puzzle-subtitle').textContent = currentPuzzle.typeText;
      document.getElementById('puzzle-status').textContent = `퍼즐 #${currentPuzzle.id} / 300 (${currentPuzzle.type})`;
      
      renderBoard();
    }

    function resetCurrentPuzzle() {
      if (!currentPuzzle) return;
      currentStep = 0;
      selectedSquare = null;
      chess.load(currentPuzzle.fen);
      document.getElementById('puzzle-status').textContent = `🔄 퍼즐을 다시 시작합니다.`;
      renderBoard();
    }

    function showHint() {
      if (!currentPuzzle) return;
      let targetFrom = currentPuzzle.solutions[0].from;

      const squares = document.querySelectorAll('.square');
      squares.forEach(sq => {
        if (sq.dataset.square === targetFrom) {
          sq.classList.add('hint-highlight');
          setTimeout(() => sq.classList.remove('hint-highlight'), 2000);
        }
      });
      document.getElementById('puzzle-status').textContent = `💡 힌트: 반짝이는 말의 이동을 고려해보세요!`;
    }

    function onSquareClick(sqName) {
      if (!selectedSquare) {
        const piece = chess.get(sqName);
        if (piece && piece.color === chess.turn()) {
          selectedSquare = sqName;
          highlightSquare(sqName);
        }
      } else {
        const from = selectedSquare;
        const to = sqName;

        const move = chess.move({ from: from, to: to, promotion: 'q' });

        if (move === null) {
          document.getElementById('puzzle-status').textContent = `⚠️ 체스 규칙상 불가능한 이동입니다.`;
          selectedSquare = null;
          renderBoard();
          return;
        }

        playMoveSound();

        const isSolutionMove = currentPuzzle.solutions.some(sol => sol.from === from && sol.to === to);

        if (isSolutionMove && chess.in_checkmate()) {
          playSuccessSound();
          solvedCount++;
          document.getElementById('score').textContent = solvedCount;
          document.getElementById('puzzle-status').textContent = `🎉 퍼즐 #${currentPuzzle.id} 정답! (CHECKMATE)`;
        } else {
          document.getElementById('puzzle-status').textContent = `❌ 퍼즐 정답이 아닙니다. 다시 시도해 보세요.`;
        }

        selectedSquare = null;
        renderBoard();
      }
    }

    function highlightSquare(sqName) {
      const squares = document.querySelectorAll('.square');
      squares.forEach(sq => {
        if (sq.dataset.square === sqName) {
          sq.classList.add('selected');
        } else {
          sq.classList.remove('selected');
        }
      });
    }

    loadRandomPuzzle();
  </script>
</body>
</html>
