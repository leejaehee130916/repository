<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI와의 체스 - Chess World</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
</head>
<body>
    <main>
        <div class="container" style="max-width: 800px; margin: 0 auto;">
            <h1 style="text-align: center;">🤖 AI 대국</h1>
            <p style="text-align: center;">난이도(Chess.com 레이팅 기준)를 선택하고 AI와 체스 게임을 진행하세요.</p>

            <div style="display: flex; gap: 15px; justify-content: center; align-items: center; margin-bottom: 20px; flex-wrap: wrap;">
                <label for="rating-select" style="color: #ccc; font-weight: bold;">AI 난이도 (Rating):</label>
                <select id="rating-select" style="padding: 8px 12px; border-radius: 4px; background: #2a2a2a; color: #fff; border: 1px solid #444; font-size: 1rem;">
                    <option value="200">Rating 200 (비기너)</option>
                    <option value="500">Rating 500 (입문)</option>
                    <option value="1000" selected>Rating 1000 (초급)</option>
                    <option value="1200">Rating 1200 (중급)</option>
                    <option value="1500">Rating 1500 (상급)</option>
                </select>
                <button id="start-btn" class="btn">🎮 새 게임 시작</button>
            </div>

            <div style="width: 100%; max-width: 450px; margin: 0 auto;">
                <div id="aiBoard" style="width: 100%;"></div>
            </div>

            <div id="game-status" style="text-align: center; font-size: 1.2rem; font-weight: bold; margin-top: 15px; min-height: 30px; color: #60a5fa;">
                게임을 시작할 준비가 되었습니다.
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Chess World. All rights reserved.</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script src="../js/header.js"></script>
    <script src="../js/ai-game.js"></script>
</body>
</html>
